name: Publish to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          # Must match the Quarto version used to create _freeze/ locally,
          # otherwise the cache is invalidated and CI tries to run R.
          version: 1.9.32

      # Quarto requires an R binary to be present for knitr-engine documents,
      # even when execution is skipped via the freeze cache.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install knitr/rmarkdown (needed for engine detection only)
        run: Rscript -e 'install.packages(c("knitr", "rmarkdown"))'

      # The R pipeline is never run in CI: results come from the committed
      # _freeze/ cache. If the qmd's code changes, re-render locally and
      # commit the updated _freeze/ alongside it, or this job will fail
      # (no data files are available here). Note: `quarto render` honors
      # the freeze cache, but `quarto publish`'s internal render does not,
      # hence the explicit render step + render: false below.
      - name: Render from freeze cache
        run: quarto render

      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
