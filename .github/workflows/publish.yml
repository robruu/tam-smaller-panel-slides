name: Publish to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      # Quarto requires an R binary to be present for knitr-engine documents,
      # even when execution is skipped via the freeze cache.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install knitr/rmarkdown (needed for engine detection only)
        run: Rscript -e 'install.packages(c("knitr", "rmarkdown"))'

      # The R pipeline is never run in CI: results come from the committed
      # _freeze/ cache. If the qmd's code changes, re-render locally and
      # commit the updated _freeze/ alongside it, or this job will fail
      # (no R or data files are available here).
      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
